<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Git Hook Doctor social preview</title>
  <desc id="desc">Explain why a Git hook will or will not run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b33"/>
      <stop offset=".55" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1135" cy="95" r="250" fill="#0ea5e9" opacity=".07"/>
  <circle cx="110" cy="615" r="250" fill="#22c55e" opacity=".045"/>
  <g transform="translate(98 168)">
    <rect width="244" height="244" rx="50" fill="#080d18" stroke="#263552" stroke-width="4"/>
    <path d="M58 62h62c34 0 61 27 61 61s-27 61-61 61h-16" fill="none" stroke="url(#line)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="54" cy="62" r="17" fill="#080d18" stroke="#67e8f9" stroke-width="10"/>
    <path d="m56 151 26 26 52-64" fill="none" stroke="#4ade80" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="398" y="258" fill="#f3f7ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="750">Git Hook Doctor</text>
  <text x="402" y="334" fill="#a9b7ce" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34">Explain why a Git hook will—or won't—run.</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23">
    <rect x="402" y="382" width="730" height="86" rx="14" fill="#080d18" stroke="#263552" stroke-width="2"/>
    <text x="433" y="435" fill="#4ade80">$</text>
    <text x="465" y="435" fill="#e6edf7">git-hook-doctor explain pre-commit</text>
  </g>
  <text x="402" y="525" fill="#67e8f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">READ-ONLY</text>
  <text x="575" y="525" fill="#67e8f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">OFFLINE</text>
  <text x="700" y="525" fill="#67e8f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">CROSS-PLATFORM</text>
  <text x="957" y="525" fill="#67e8f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">NO HOOKS EXECUTED</text>
</svg>
