<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Git Hook Doctor logo</title>
  <desc id="desc">A cyan hook path and green diagnostic check on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b33"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="hook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bg)" stroke="#263552" stroke-width="4" filter="url(#shadow)"/>
  <path d="M74 66h58c31 0 56 25 56 56s-25 56-56 56h-14" fill="none" stroke="url(#hook)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="70" cy="66" r="17" fill="#0b1220" stroke="#67e8f9" stroke-width="10"/>
  <path d="m71 145 24 24 48-58" fill="none" stroke="#4ade80" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
